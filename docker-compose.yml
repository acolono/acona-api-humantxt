services:

  web:
    build: .
    restart: unless-stopped
    read_only: true
    mem_limit: "4g"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
    cpus: 2
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=256m
